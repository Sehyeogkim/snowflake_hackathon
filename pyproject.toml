[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mavis-scheduler"
version = "0.1.0"
description = "Memory-aware visual inference scheduling for factory safety video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "everos-cloud==1.0.0",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "httpx>=0.27,<1",
  "google-genai>=1.30,<2",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.14,<5"]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
mavis = "mavis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mavis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "PYI034", "TRY004"]
